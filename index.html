background-repeat: repeat;

background-size: 420px 420px;

background-position: center;


font-family:'Jost',sans-serif;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

position:relative;

}



/* Texture naturale */

body::before {

content:"";

position:fixed;

inset:0;

background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.035'/%3E%3C/svg%3E");

pointer-events:none;

opacity:.55;

z-index:0;

}



/* contenitore decorazioni */

.decor {

position:fixed;

pointer-events:none;

z-index:1;

}



/* animazioni foglie */

.leaf-float {

position:fixed;

opacity:0;

pointer-events:none;

z-index:2;

animation:floatLeaf 14s ease-in-out infinite;

}



@keyframes floatLeaf {


0% {

opacity:0;

transform:
translateY(20px)
rotate(-10deg);

}


20% {

opacity:.35;

}


50% {

opacity:.55;

transform:
translateY(-15px)
rotate(10deg);

}


80% {

opacity:.35;

}


100% {

opacity:0;

transform:
translateY(20px)
rotate(-10deg);

}


}



/* Card principale */

.card {


position:relative;

z-index:10;

width:calc(100% - 40px);

max-width:540px;


background:

rgba(245,240,232,.60);


backdrop-filter:

blur(18px);


-webkit-backdrop-filter:

blur(18px);



border:

1px solid rgba(184,151,90,.25);



border-radius:6px;


padding:

56px 64px 52px;


text-align:center;


box-shadow:

0 20px 50px rgba(78,110,74,.18),

0 2px 10px rgba(78,110,74,.08);


animation:

cardIn 1.2s ease both;


}



@keyframes cardIn {


from {

opacity:0;

transform:
translateY(40px)
scale(.97);

}


to {

opacity:1;

transform:
translateY(0)
scale(1);

}


}


/* Linee decorative della card */

.card::before {

content:"";

position:absolute;

top:0;

left:50%;

transform:translateX(-50%);

width:90px;

height:2px;

background:
linear-gradient(
90deg,
transparent,
var(--gold),
transparent
);

}



.card::after {

content:"";

position:absolute;

bottom:0;

left:50%;

transform:translateX(-50%);

width:90px;

height:2px;

background:
linear-gradient(
90deg,
transparent,
var(--gold),
transparent
);

}



/* Etichetta superiore */

.label-top {


font-family:'Jost',sans-serif,cursive;

font-size:.7rem;

font-weight:300;

letter-spacing:.35em;

text-transform:uppercase;

color:var(--sage-dark);

margin-bottom:20px;

opacity:.8;


animation:

cardIn 1.3s ease .1s both;


}



/* Titolo principale */


.title-main {


font-family:'Pinyon Script',cursive;

font-style:normal;

font-size:

clamp(3rem,9vw,4.5rem);


line-height:1.05;


letter-spacing:.02em;


color:var(--sepia);


font-weight:400;


animation:

cardIn 1.5s ease .15s both;


}



/* Nome degli sposi */


.title-and {


display:inline-block;

text-align:left;


font-family:'Cormorant Garamond',serif;


font-style:italic;


font-weight:400;


font-size:clamp(1.6rem,6.5vw,2.5rem);


letter-spacing:.1em;


line-height:.95;


margin-top:6px;


color:#906b48;


}

.name-line {
display:block;
}

.name-line-v {
margin-left:1.1em;
margin-top:-.22em;
}

/* La "&" tra i due nomi: sotto la O di Armando, sopra la seconda S di
   Vanessa */

.amp {

display:block;

margin-left:3.6em;

font-family:'Florilane Cardillac','Marcellus',serif;

font-style:normal;

font-weight:400;

letter-spacing:0;

color:inherit;

}



/* Separatore ulivo */


.inner-sprig {


display:flex;

align-items:center;

justify-content:center;

gap:15px;


margin:

24px 0 28px;


animation:

cardIn 1.4s ease .25s both;


}



.inner-sprig .line {


height:1px;

flex:1;


background:

linear-gradient(

90deg,

transparent,

var(--gold-light),

transparent

);


}




/* Titolo descrizione */


.subtitle {


font-family:'Jost',sans-serif;


font-weight:300;


font-size:.72rem;


letter-spacing:.25em;


text-transform:uppercase;


color:var(--sage-dark);


opacity:.75;


margin-top:10px;


animation:

cardIn 1.5s ease .3s both;


}



/* Pulsante upload */


.btn-upload {


display:inline-flex;


align-items:center;


justify-content:center;


gap:10px;



margin-top:36px;


padding:

16px 38px;



background:

linear-gradient(

135deg,

var(--sage-dark),

var(--sage)

);



color:var(--cream);


font-family:'Jost',sans-serif;


font-size:.78rem;


font-weight:400;


letter-spacing:.25em;


text-transform:uppercase;


border:none;


border-radius:3px;


cursor:pointer;


position:relative;


overflow:hidden;



box-shadow:


0 8px 25px rgba(78,110,74,.30);



transition:

transform .25s ease,

box-shadow .25s ease;



animation:

cardIn 1.6s ease .4s both;


}



/* Stato "pronto al caricamento": la foto è stata scelta, va ripremuto
   il pulsante per confermare l'invio */

.btn-upload-ready {
background:
linear-gradient(
135deg,
#c9a24b,
#dbb968
) !important;

box-shadow:
0 8px 25px rgba(201,162,75,.40) !important;

animation:
readyPulse 1.4s ease-in-out infinite;
}

@keyframes readyPulse {
0%, 100% { transform:scale(1); }
50% { transform:scale(1.03); }
}

/* Pulsante galleria (secondario, ma con carattere) */

.btn-gallery {

display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;

margin-top:22px;

padding:14px 16px;

background:
linear-gradient(
135deg,
rgba(253,250,246,.9),
rgba(197,207,191,.35)
);

color:var(--sage-dark);

font-family:'Jost',sans-serif;
font-size:.74rem;
font-weight:400;
letter-spacing:.22em;
text-transform:uppercase;

border:2.5px solid var(--sepia);
border-radius:30px;

cursor:pointer;
position:relative;
overflow:hidden;

box-shadow:
0 4px 16px rgba(184,151,90,.15);

transition:
transform .3s ease,
box-shadow .3s ease,
border-color .3s ease,
background .3s ease;
}

.btn-gallery:hover {
transform:translateY(-2px);
border-color:var(--sepia);
background:
linear-gradient(
135deg,
rgba(253,250,246,1),
rgba(212,176,122,.25)
);
box-shadow:
0 10px 26px rgba(184,151,90,.28);
}

.btn-gallery:active {
transform:translateY(0);
}

.btn-gallery .upload-icon {
width:28px;
height:28px;
transition:transform .35s ease;
}

.btn-gallery:hover .upload-icon {
transform:scale(1.12) rotate(-4deg);
}

/* Galleria a schermo intero */

.gallery-overlay {
position:fixed;
inset:0;
z-index:60;
background:var(--crema, #fdfaf6);
display:flex;
flex-direction:column;
transform:translateY(100%);
transition:transform .35s ease;
}

.gallery-overlay.open {
transform:translateY(0);
}

.gallery-top {
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 20px;
background:linear-gradient(180deg,#fdfaf6,var(--cream));
border-bottom:1px solid rgba(184,151,90,.35);
flex-shrink:0;
}

.gallery-title {
font-family:'Cormorant Garamond',serif;
font-style:italic;
font-size:1.4rem;
color:var(--sage-dark);
letter-spacing:.04em;
}

.gallery-close {
width:34px;
height:34px;
border-radius:50%;
border:1.3px solid var(--gold);
background:#fff;
font-size:1rem;
line-height:1;
color:#906b48;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
padding:0;
transition:background .2s ease,transform .2s ease;
}

.gallery-close:hover {
background:var(--cream);
transform:scale(1.06);
}

.gallery-body {
flex:1;
overflow-y:auto;
padding:16px;
}

.gallery-status {
text-align:center;
color:#8a7a5c;
font-family:'Jost',sans-serif;
font-size:.85rem;
margin-top:40px;
display:none;
}

.gallery-grid {
display:grid;
grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
gap:6px;
}

.gallery-item {
position:relative;
aspect-ratio:1/1;
border:none;
padding:0;
background:#eee5d8;
border-radius:10px;
overflow:hidden;
cursor:pointer;
box-shadow:0 2px 6px rgba(78,110,74,.15);
}

.gallery-item img {
width:100%;
height:100%;
object-fit:cover;
display:block;
opacity:0;
transition:opacity .3s ease;
}

.gallery-item img[src] {
opacity:1;
}

.gallery-video-badge {
position:absolute;
bottom:6px;
right:6px;
background:rgba(0,0,0,.55);
color:#fff;
font-size:.7rem;
padding:2px 6px;
border-radius:3px;
}

/* Lightbox */

.lightbox {
position:fixed;
inset:0;
z-index:70;
background:rgba(20,18,14,.94);
display:none;
align-items:center;
justify-content:center;
}

.lightbox.open {
display:flex;
}

.lightbox-stage {
max-width:92vw;
max-height:86vh;
display:flex;
align-items:center;
justify-content:center;
}

.lightbox-stage img,
.lightbox-stage video {
max-width:92vw;
max-height:86vh;
object-fit:contain;
border-radius:2px;
}

.lightbox-close {
position:absolute;
top:16px;
right:20px;
background:none;
border:none;
color:#fff;
font-size:2rem;
line-height:1;
cursor:pointer;
}

.lightbox-nav {
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(255,255,255,.12);
border:none;
color:#fff;
font-size:2rem;
width:44px;
height:44px;
border-radius:50%;
cursor:pointer;
line-height:1;
}

.lightbox-prev { left:14px; }
.lightbox-next { right:14px; }

.btn-upload:hover {


transform:translateY(-3px);


box-shadow:

0 14px 35px rgba(78,110,74,.35);


}



.btn-upload:active {


transform:translateY(0);


}




.btn-upload::after {


content:"";


position:absolute;


top:0;


left:-80%;


width:50%;


height:100%;



background:

linear-gradient(

90deg,

transparent,

rgba(255,255,255,.25),

transparent

);



transform:skewX(-25deg);


transition:.7s;


}



.btn-upload:hover::after {


left:130%;


}



/* Icona upload */


.upload-icon {


width:16px;

height:16px;


opacity:.9;


}



/* input nascosto */


#fileInput {


display:none;


}



/* testo sotto pulsante */


.preview-hint {


margin-top:16px;


font-family:'Cormorant Garamond',serif;


font-style:italic;


font-size:.85rem;


color:var(--sage-dark);


opacity:.65;


letter-spacing:.05em;


min-height:20px;



}



/* separatore e frase invito */

.cta-sprig {

display:flex;
align-items:center;
justify-content:center;
gap:12px;

margin-top:34px;

}

.cta-sprig .line {

height:1px;
width:50px;

background:
linear-gradient(
90deg,
transparent,
var(--gold-light),
transparent
);

}

.cta-text {

<div class="gallery-overlay" id="galleryOverlay" aria-hidden="true">
  <div class="gallery-top">
    <span class="gallery-title">I nostri ricordi</span>
    <button class="gallery-close" id="galleryClose" aria-label="Chiudi">&times;</button>
  </div>
  <div class="gallery-body" id="galleryBody">
    <p class="gallery-status" id="galleryStatus">Caricamento…</p>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Chiudi">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Precedente">&#8249;</button>
  <div class="lightbox-stage" id="lightboxStage"></div>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Successivo">&#8250;</button>
</div>

<script>
// Indirizzo del backend su Render (aggiornalo con il tuo dopo il deploy)
const BACKEND_URL = 'https://mywedupload.onrender.com';

const input = document.getElementById('fileInput');
const hint = document.getElementById('hint');
const button = document.querySelector('.btn-upload');
const btnLabel = document.getElementById('btnLabel');
const params = new URLSearchParams(location.search);
const weddingToken = params.get('t') || '';

function setHint(text, ok = true) {
  hint.textContent = text;
  hint.style.opacity = '1';
  hint.style.color = ok ? '#4e6e4a' : '#8a3d3d';
}

async function uploadSelectedFiles() {
  if (!input.files?.length) return;
  if (!weddingToken) { setHint('QR non valido.', false); return; }

  const files = [...input.files];

  const form = new FormData();
  for (const file of files) form.append('files', file, file.name);

  button.classList.remove('btn-upload-ready');
  button.disabled = true;
  button.style.opacity = '.65';
  btnLabel.textContent = 'Caricamento…';
  setHint('Caricamento in corso…');
  try {
    const response = await fetch(`${BACKEND_URL}/api/upload`, {
      method: 'POST',
      headers: { 'X-Wedding-Token': weddingToken },
      body: form
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Caricamento non riuscito.');
    input.value = '';
    setHint(`✓ Grazie! ${data.count === 1 ? 'Il tuo ricordo è stato aggiunto' : 'I tuoi ricordi sono stati aggiunti'} 💚`);
  } catch (err) {
    setHint(err.message || 'Caricamento non riuscito.', false);
  } finally {
    button.disabled = false;
    button.style.opacity = '1';
    btnLabel.textContent = 'Condividi i tuoi scatti';
  }
}

// Dopo la scelta, il pulsante diventa giallo: segnala che va ripremuto per
// caricare davvero.
input.addEventListener('change', () => {
  const files = [...(input.files || [])];
  if (!files.length) return;
  const totalMB = files.reduce((n, f) => n + f.size, 0) / 1024 / 1024;
  setHint(`${files.length} ${files.length === 1 ? 'elemento selezionato' : 'elementi selezionati'} · ${totalMB.toFixed(1)} MB — tocca di nuovo per caricare`);
  btnLabel.textContent = files.length === 1 ? 'Condividi' : `Condividi (${files.length})`;
  button.classList.add('btn-upload-ready');
});

button.addEventListener('click', () => {
  // Se non hai ancora scelto nessuna foto/video, il pulsante apre la selezione file
  if (!input.files?.length) {
    input.click();
    return;
  }
  // Altrimenti conferma il caricamento di quanto già scelto
  uploadSelectedFiles();
});

// ---------------------------------------------------------------------
// Galleria dei ricordi già caricati
// ---------------------------------------------------------------------

const galleryBtn = document.getElementById('galleryBtn');
const galleryOverlay = document.getElementById('galleryOverlay');
const galleryClose = document.getElementById('galleryClose');
const galleryGrid = document.getElementById('galleryGrid');
const galleryStatus = document.getElementById('galleryStatus');
const lightbox = document.getElementById('lightbox');
const lightboxStage = document.getElementById('lightboxStage');
const lightboxClose = document.getElementById('lightboxClose');
const lightboxPrev = document.getElementById('lightboxPrev');
const lightboxNext = document.getElementById('lightboxNext');

let galleryFiles = [];
let currentIndex = -1;

function mediaUrl(id) {
  return `${BACKEND_URL}/api/photos/${id}/media?token=${encodeURIComponent(weddingToken)}`;
}

async function loadGallery() {
  galleryGrid.innerHTML = '';
  galleryStatus.textContent = 'Caricamento…';
  galleryStatus.style.display = 'block';
  try {
    const response = await fetch(`${BACKEND_URL}/api/photos?token=${encodeURIComponent(weddingToken)}`);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Impossibile caricare la galleria.');
    galleryFiles = data.files || [];
    renderGallery();
  } catch (err) {
    galleryStatus.textContent = err.message || 'Impossibile caricare la galleria.';
    galleryStatus.style.display = 'block';
  }
}

function renderGallery() {
  galleryGrid.innerHTML = '';
  if (!galleryFiles.length) {
    galleryStatus.textContent = 'Non ci sono ancora ricordi condivisi. Sii il primo!';
    galleryStatus.style.display = 'block';
    return;
  }
  galleryStatus.style.display = 'none';
  galleryFiles.forEach((file, i) => {
    const item = document.createElement('button');
    item.className = 'gallery-item';
    item.type = 'button';
    item.setAttribute('aria-label', file.isVideo ? 'Apri video' : 'Apri foto');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = mediaUrl(file.id);
    img.alt = '';
    item.appendChild(img);
    if (file.isVideo) {
      const badge = document.createElement('span');
      badge.className = 'gallery-video-badge';
      badge.innerHTML = '▶';
      item.appendChild(badge);
    }
    item.addEventListener('click', () => openLightbox(i));
    galleryGrid.appendChild(item);
  });
}

function openLightbox(index) {
  currentIndex = index;
  const file = galleryFiles[index];
  lightboxStage.innerHTML = '';
  if (file.isVideo) {
    const video = document.createElement('video');
    video.src = mediaUrl(file.id);
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    lightboxStage.appendChild(video);
  } else {
    const img = document.createElement('img');
    img.src = mediaUrl(file.id);
    img.alt = '';
    lightboxStage.appendChild(img);
  }
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
}

function closeLightbox() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
  lightboxStage.innerHTML = '';
  currentIndex = -1;
}

function showRelative(delta) {
  if (currentIndex < 0) return;
  const next = (currentIndex + delta + galleryFiles.length) % galleryFiles.length;
  openLightbox(next);
}

galleryBtn.addEventListener('click', () => {
  if (!weddingToken) { setHint('QR non valido.', false); return; }
  galleryOverlay.classList.add('open');
  galleryOverlay.setAttribute('aria-hidden', 'false');
  loadGallery();
});

galleryClose.addEventListener('click', () => {
  galleryOverlay.classList.remove('open');
  galleryOverlay.setAttribute('aria-hidden', 'true');
});

lightboxClose.addEventListener('click', closeLightbox);
lightboxPrev.addEventListener('click', () => showRelative(-1));
lightboxNext.addEventListener('click', () => showRelative(1));
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

document.addEventListener('keydown', (e) => {
  if (lightbox.classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showRelative(-1);
    if (e.key === 'ArrowRight') showRelative(1);
  }
});
</script>



</body>

</html>
